name: VibeWatch
options:
  bundleIdPrefix: dev.vibewatch
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: '0.1.0'
    CODE_SIGN_STYLE: Automatic
    VIBEWATCH_BUNDLE_PREFIX: dev.vibewatch
    VIBEWATCH_APP_GROUP: group.dev.vibewatch.shared
    VIBEWATCH_KEYCHAIN_GROUP: $(AppIdentifierPrefix)dev.vibewatch.shared
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  VibeWatch:
    type: application
    platform: iOS
    sources: [Shared, iPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEWATCH_BUNDLE_PREFIX).phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(VIBEWATCH_PHONE_PROFILE)
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: VibeWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        VibeWatchAppGroup: $(VIBEWATCH_APP_GROUP)
        VibeWatchKeychainGroup: $(VIBEWATCH_KEYCHAIN_GROUP)
        VibeWatchLegacyKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        NSCameraUsageDescription: 扫描 Mac 生成的一次性配对二维码。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: dev.vibewatch.pair
            CFBundleURLSchemes: [vibewatch]
    entitlements:
      path: iPhone/VibeWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(VIBEWATCH_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER), $(VIBEWATCH_KEYCHAIN_GROUP)]
    dependencies:
      - target: VibeWatchWatch
        embed: true
      - target: VibeWatchPhoneWidgets
        embed: true
  VibeWatchPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
        excludes: [AppModel.swift, QuotaViews.swift]
      - path: PhoneWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEWATCH_BUNDLE_PREFIX).phone.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(VIBEWATCH_PHONE_WIDGET_PROFILE)
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: PhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: VibeWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        VibeWatchAppGroup: $(VIBEWATCH_APP_GROUP)
        VibeWatchKeychainGroup: $(VIBEWATCH_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PhoneWidgets/VibeWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(VIBEWATCH_APP_GROUP)]
        keychain-access-groups: [$(VIBEWATCH_KEYCHAIN_GROUP)]
  VibeWatchWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEWATCH_BUNDLE_PREFIX).phone.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(VIBEWATCH_WATCH_PROFILE)
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: VibeWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        VibeWatchAppGroup: $(VIBEWATCH_APP_GROUP)
        VibeWatchKeychainGroup: $(VIBEWATCH_KEYCHAIN_GROUP)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(VIBEWATCH_BUNDLE_PREFIX).phone
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.vibewatch.quota
            CFBundleURLSchemes: [vibewatch]
    entitlements:
      path: Watch/VibeWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(VIBEWATCH_APP_GROUP)]
        keychain-access-groups: [$(VIBEWATCH_KEYCHAIN_GROUP)]
    dependencies:
      - target: VibeWatchWidgets
        embed: true
  VibeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
        excludes: [AppModel.swift, QuotaViews.swift]
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEWATCH_BUNDLE_PREFIX).phone.watch.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(VIBEWATCH_WIDGET_PROFILE)
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '4'
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: VibeWatch 额度
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        VibeWatchAppGroup: $(VIBEWATCH_APP_GROUP)
        VibeWatchKeychainGroup: $(VIBEWATCH_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/VibeWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(VIBEWATCH_APP_GROUP)]
        keychain-access-groups: [$(VIBEWATCH_KEYCHAIN_GROUP)]
  VibeWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: VibeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEWATCH_BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VibeWatch:
    build:
      targets:
        VibeWatch: all
  VibeWatchTests:
    build:
      targets:
        VibeWatchTests: all
    test:
      targets: [VibeWatchTests]
  VibeWatchWatch:
    build:
      targets:
        VibeWatchWatch: all
  VibeWatchHTTPTests:
    build:
      targets:
        VibeWatchTests: all
    test:
      targets: [VibeWatchTests]
      environmentVariables:
        VIBEWATCH_HTTP_TEST: '1'
